name: "Link"

on:
  push:
    branches: [main]
    paths: ["**/*.md"]
  pull_request:
    branches: [main]
    paths: ["**/*.md"]
  schedule:
    # 每周一 UTC 0:00，即北京时间 8:00
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续 push 时，只保留最新一次，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    # 防止某个链接卡住导致整个 job 跑满默认上限（360 分钟）。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --exclude '^https?://fsf\.org/?'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
